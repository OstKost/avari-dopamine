name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "docs/api/openapi.yaml"
      - ".github/workflows/frontend-ci.yml"

jobs:
  build-and-test:
    name: Frontend Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: |
          cd apps/web
          pnpm install --no-frozen-lockfile

      - name: Generate API types & verify clean git status
        run: |
          cd apps/web
          pnpm generate:api-types
          git diff --exit-code lib/api/generated-types.ts || (echo "Generated API types are out of date! Run 'pnpm generate:api-types' and commit." && exit 1)

      - name: Run linter
        run: |
          cd apps/web
          pnpm lint

      - name: Run typecheck
        run: |
          cd apps/web
          pnpm typecheck

      - name: Build Next.js app
        run: |
          cd apps/web
          pnpm build
