name: Architecture Linter Gate

on:
  push:
    branches: [main]
    paths:
      - "apps/api/internal/**"
      - "apps/api/.golangci.yml"
      - ".github/workflows/arch-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/internal/**"
      - "apps/api/.golangci.yml"
      - ".github/workflows/arch-lint.yml"

jobs:
  arch-lint:
    name: Module Boundary Check (depguard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: apps/api/go.sum

      - name: Run Architecture Boundary Check (depguard)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v1.62.2
          working-directory: apps/api
          args: --timeout=5m
