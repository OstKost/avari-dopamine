name: Architecture Linter Gate

on:
  push:
    branches: [main]
    paths:
      - "apps/api/internal/**"
      - "apps/api/.golangci.yml"
      - ".github/workflows/arch-lint.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/api/internal/**"
      - "apps/api/.golangci.yml"
      - ".github/workflows/arch-lint.yml"

jobs:
  arch-lint:
    name: Module Boundary Check (depguard)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.23.4"
          cache-dependency-path: apps/api/go.sum

      - name: Run Architecture Boundary Check
        run: |
          cd apps/api
          export GOTOOLCHAIN=local
          make lint-arch
