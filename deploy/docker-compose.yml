# deploy/docker-compose.yml — единый стек инфраструктуры для локальной
# разработки и single-VPS деплоя (ADR-002: single-node на масштабе 100 MAU).
#
# ВНИМАНИЕ ДЛЯ АГЕНТОВ: этот файл написан и статически проверен (docker
# compose config), но НЕ был реально поднят и протестирован end-to-end —
# Docker/docker-compose недоступны в песочнице, где выполнялась реализация
# EPIC-00 (см. docs/epics/EPIC-00-platform-bootstrap.md "Известные
# ограничения окружения агента"). Первый агент/человек с доступом к Docker
# должен прогнать `docker compose up -d`, убедиться что все health checks
# зелёные, и обновить этот комментарий, зафиксировав результат.
#
# Быстрый старт:
#   cp .env.example .env      # заполнить секреты
#   docker compose --env-file .env -f deploy/docker-compose.yml up -d
#   docker compose -f deploy/docker-compose.yml ps   # все сервисы healthy?
#
# Профиль observability (опционально, добавляет Jaeger, ADR-010):
#   docker compose -f deploy/docker-compose.yml --profile observability up -d

name: dopamine-market

networks:
  dopamine-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  opensearch-data:
  mongodb-data:
  graylog-data:

services:
  # ---------------------------------------------------------------------
  # Основное хранилище: одна база Postgres, схема на модуль (ADR-011).
  # ---------------------------------------------------------------------
  postgres:
    image: postgres:16.4-alpine
    container_name: dm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-dopamine}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-dopamine_market}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - dopamine-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-dopamine}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Redis: корзина (cart, ADR-008), refresh-токены (ADR-007), rate-limit.
  # ---------------------------------------------------------------------
  redis:
    image: redis:7.4-alpine
    container_name: dm-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:?REDIS_PASSWORD is required}"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - dopamine-net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $${REDIS_PASSWORD} ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Kafka в режиме KRaft (без ZooKeeper) — single-node broker, достаточно
  # для 100 MAU (ADR-002, ADR-003). Топики создаются consumer/producer
  # автоматически (auto.create.topics.enable=true) на этапе bootstrap;
  # для production рекомендуется явное создание топиков с заданным
  # числом партиций через init-скрипт (TODO для EPIC-05, когда появятся
  # реальные топики order.events, payment.events, delivery.events).
  # ---------------------------------------------------------------------
  kafka:
    image: bitnami/kafka:3.8.1
    container_name: dm-kafka
    restart: unless-stopped
    environment:
      KAFKA_CFG_NODE_ID: "0"
      KAFKA_CFG_PROCESS_ROLES: "controller,broker"
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "0@kafka:9093"
      KAFKA_CFG_LISTENERS: "PLAINTEXT://:9092,CONTROLLER://:9093"
      KAFKA_CFG_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:9092"
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT"
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "127.0.0.1:9092:9092"
    volumes:
      - kafka-data:/bitnami/kafka
    networks:
      - dopamine-net
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------
  # Graylog + его собственные зависимости (ADR-010). OpenSearch заменяет
  # Elasticsearch (лицензионные изменения последнего) как storage backend,
  # MongoDB хранит конфигурацию/метаданные Graylog.
  # ---------------------------------------------------------------------
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    container_name: dm-opensearch
    restart: unless-stopped
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - "discovery.type=single-node"
      - "plugins.security.disabled=true"
      - "action.auto_create_index=false"
      - "bootstrap.memory_lock=true"
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    networks:
      - dopamine-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  mongodb:
    image: mongo:6.0.19
    container_name: dm-mongodb
    restart: unless-stopped
    volumes:
      - mongodb-data:/data/db
    networks:
      - dopamine-net
    healthcheck:
      test: ["CMD-SHELL", "mongosh --eval 'db.adminCommand(\"ping\")' --quiet || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  graylog:
    image: graylog/graylog:6.1.2
    container_name: dm-graylog
    restart: unless-stopped
    depends_on:
      opensearch:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    environment:
      GRAYLOG_PASSWORD_SECRET: ${GRAYLOG_PASSWORD_SECRET:?GRAYLOG_PASSWORD_SECRET is required (32+ random chars)}
      GRAYLOG_ROOT_PASSWORD_SHA2: ${GRAYLOG_ROOT_PASSWORD_SHA2:?GRAYLOG_ROOT_PASSWORD_SHA2 is required (sha256 of admin password)}
      GRAYLOG_HTTP_EXTERNAL_URI: "http://localhost:9000/"
      GRAYLOG_ELASTICSEARCH_HOSTS: "http://opensearch:9200"
      GRAYLOG_MONGODB_URI: "mongodb://mongodb:27017/graylog"
    ports:
      - "127.0.0.1:9000:9000"   # Web UI
      - "127.0.0.1:12201:12201/udp"  # GELF UDP input — должен быть создан вручную в UI при первом запуске (System > Inputs)
    volumes:
      - graylog-data:/usr/share/graylog/data
    networks:
      - dopamine-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/api/system/lbstatus || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 15

  # ---------------------------------------------------------------------
  # Профиль observability (опциональный, ADR-010): Jaeger для просмотра
  # распределённых трейсов (OTLP). Не входит в базовый `docker compose up`.
  # ---------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    container_name: dm-jaeger
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"  # Web UI
      - "127.0.0.1:4317:4317"    # OTLP gRPC
      - "127.0.0.1:4318:4318"    # OTLP HTTP
    networks:
      - dopamine-net
