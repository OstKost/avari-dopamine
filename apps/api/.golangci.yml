# Конфигурация golangci-lint для apps/api.
#
# Ключевое правило для agentic development (ADR-004, AGENTS.md §1
# "Границы модулей — закон"): depguard запрещает импортировать
# internal/modules/** откуда-либо, кроме cmd/** (composition root) и
# самого модуля. Межмодульная коммуникация — ТОЛЬКО через
# internal/contracts/*. Это единственный способ безопасно распараллелить
# работу нескольких агентов по разным модулям без постоянных merge-конфликтов
# и протечек абстракций.
#
# `make lint-arch` (см. Makefile) запускает golangci-lint с --disable-all
# --enable=depguard, чтобы дать быстрый читаемый сигнал именно по
# архитектурному правилу, отдельно от общего `make lint`.

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - depguard
    - errcheck
    - staticcheck
    - revive
    - govet
    - ineffassign
    - unused
    - gofmt
    - goimports

linters-settings:
  depguard:
    rules:
      # Правило по умолчанию: применяется к любому файлу, если не
      # переопределено более специфичным правилом ниже. golangci-lint
      # применяет ПЕРВОЕ совпавшее по files-паттерну правило.
      modules-boundary:
        # Правило применяется ко всем файлам, кроме cmd/** (composition
        # root — единственное разрешённое место для импорта конкретных
        # модулей при связывании зависимостей). Файл самого модуля не
        # нуждается в импорте internal/modules/<себя> — Go-пакет обращается
        # к своим соседним файлам без import вообще, поэтому запрет
        # "импортировать internal/modules откуда угодно, кроме cmd" не даёт
        # false positive для кода внутри самого модуля.
        files:
          - "!**/cmd/**"
        deny:
          - pkg: "github.com/ostkost/dopamine-market/api/internal/modules"
            desc: >-
              Прямой импорт internal/modules/** запрещён везде, кроме
              cmd/** (composition root). Используйте internal/contracts/*
              для межмодульной коммуникации (ADR-004). Если вы видите эту
              ошибку — скорее всего, нужен новый интерфейс в
              internal/contracts, а не прямой импорт.

  revive:
    rules:
      - name: exported
        severity: warning
      - name: package-comments
        severity: warning
      - name: error-strings
        severity: warning

  errcheck:
    # Игнорируем непроверенные ошибки в defer'ах закрытия — паттерн
    # `defer conn.Close()` встречается часто в platform-пакетах и не
    # является риском для этого проекта (утечка соединения при ошибке
    # закрытия не критична на масштабе 100 MAU).
    exclude-functions:
      - (io.Closer).Close

issues:
  # golangci-lint по умолчанию включает большой пресет exclude-rules,
  # который глушит часть находок ряда линтеров (в т.ч. затрагивает
  # обработку depguard в некоторых версиях) — отключаем, чтобы
  # архитектурное правило работало предсказуемо и без скрытых исключений.
  exclude-use-default: false
  exclude-dirs:
    - migrations
  # На этапе EPIC-00 internal/modules/** пуст (кроме .gitkeep) — правило
  # depguard не даёт реальных совпадений до EPIC-01. Это ожидаемо: правило
  # должно быть включено с первого дня, чтобы агенты EPIC-01+ сразу
  # работали в условиях действующей архитектурной проверки, а не добавляли
  # её постфактум, когда нарушения уже накопились.
  max-issues-per-linter: 0
  max-same-issues: 0
