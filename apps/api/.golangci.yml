version: "2"
run:
  tests: true
linters:
  default: none
  enable:
    - depguard
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        platform-boundary:
          files:
            - '**/internal/platform/**'
            - '**/internal/contracts/**'
          deny:
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules
              desc: Платформенные пакеты и контракты не должны импортировать модули.
        identity-boundary:
          files:
            - '**/internal/modules/identity/**'
          deny:
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/catalog
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/pickup
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/cart
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/order
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/payment
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/delivery
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/notification
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/gamification
              desc: Межмодульный импорт запрещен (ADR-004). Используйте internal/contracts.
        catalog-boundary:
          files:
            - '**/internal/modules/catalog/**'
          deny:
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/identity
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/pickup
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/cart
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/order
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/payment
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/delivery
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/notification
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/gamification
              desc: Межмодульный импорт запрещен (ADR-004). Используйте internal/contracts.
        pickup-boundary:
          files:
            - '**/internal/modules/pickup/**'
          deny:
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/identity
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/catalog
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/cart
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/order
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/payment
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/delivery
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/notification
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/gamification
              desc: Межмодульный импорт запрещен (ADR-004). Используйте internal/contracts.
        cart-boundary:
          files:
            - '**/internal/modules/cart/**'
          deny:
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/identity
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/catalog
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/pickup
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/order
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/payment
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/delivery
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/notification
            - pkg: github.com/ostkost/dopamine-market/api/internal/modules/gamification
              desc: Межмодульный импорт запрещен (ADR-004). Используйте internal/contracts.
    errcheck:
      exclude-functions:
        - (io.Closer).Close
  exclusions:
    generated: lax
    paths:
      - migrations
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
